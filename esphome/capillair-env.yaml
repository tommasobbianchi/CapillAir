# CapillAir ambient sensor — M5Stack Atom Lite + ENV IV unit (SHT40 + BMP280).
# Purpose: whole-house ambient temperature / relative + absolute humidity / pressure
# feed for the CapillAir project (peak-humidity / condensation-risk analysis).
#
# Recipe proven on the sibling Atom Lite (essiccatorefilamento): board esp32dev,
# arduino, I2C on the Grove port SDA=GPIO26 / SCL=GPIO32. ENV IV adds BMP280 (0x76)
# next to the SHT40 (0x44). Both confirmed present by boot i2c scan.
#
# Status LED (onboard SK6812 @ GPIO27):
#   red         = WiFi NOT connected
#   solid blue  = WiFi + Home Assistant both connected (healthy)
#   blinking blue = error: WiFi up but HA API not connected
esphome:
  name: capillair-env
  friendly_name: CapillAir ENV IV
  on_boot:
    priority: -100          # after LED init: start red (nothing connected yet)
    then:
      - light.turn_on:
          id: status_led
          brightness: 30%
          red: 100%
          green: 0%
          blue: 0%
          effect: "None"

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:
  encryption:
    key: !secret api_key_capillair
  on_client_connected:
    then:
      - light.turn_on:         # HA connected -> solid blue = healthy
          id: status_led
          brightness: 30%
          red: 0%
          green: 0%
          blue: 100%
          effect: "None"
  on_client_disconnected:
    then:
      - if:
          condition:
            wifi.connected:     # still on WiFi but lost HA -> error -> blink blue
          then:
            - light.turn_on:
                id: status_led
                brightness: 30%
                red: 0%
                green: 0%
                blue: 100%
                effect: "Blink"

ota:
  platform: esphome
  password: !secret ota_password_capillair

# Both SSIDs as client networks: the device auto-joins whichever is in range.
wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
    - ssid: !secret wifi_ssid_fallback
      password: !secret wifi_password_fallback
  power_save_mode: none
  on_connect:
    then:
      - light.turn_on:         # WiFi up, HA not yet -> blink blue until API connects
          id: status_led
          brightness: 30%
          red: 0%
          green: 0%
          blue: 100%
          effect: "Blink"
  on_disconnect:
    then:
      - light.turn_on:         # WiFi lost -> red
          id: status_led
          brightness: 30%
          red: 100%
          green: 0%
          blue: 0%
          effect: "None"

# Onboard SK6812 RGB LED (GPIO27). Native RMT driver — no neopixelbus dependency.
light:
  - platform: esp32_rmt_led_strip
    name: "LED Stato"
    id: status_led
    pin: GPIO27
    num_leds: 1
    chipset: SK6812
    rgb_order: GRB
    restore_mode: ALWAYS_OFF
    effects:
      - pulse:
          name: "Blink"
          transition_length: 200ms
          update_interval: 500ms

i2c:
  sda: GPIO26
  scl: GPIO32
  scan: true            # logs detected addresses at boot — confirms 0x44 + 0x76

sensor:
  - platform: sht4x      # SHT40 @ 0x44 — canonical temperature + relative humidity
    address: 0x44
    temperature:
      name: "Temperatura"
      id: temp_sht
      accuracy_decimals: 2
    humidity:
      name: "Umidità"
      id: hum_sht
      accuracy_decimals: 2
    update_interval: 30s

  - platform: bmp280_i2c  # BMP280 @ 0x76 — barometric pressure (temp kept internal)
    address: 0x76
    temperature:
      name: "Temperatura BMP"
      id: temp_bmp
      internal: true
    pressure:
      name: "Pressione"
      id: pressure_bmp
      accuracy_decimals: 1
    update_interval: 30s

  # Absolute humidity (g/m³): the physically meaningful "water content of the air"
  # for capillary condensation analysis, independent of temperature swings.
  - platform: absolute_humidity
    name: "Umidità Assoluta"
    temperature: temp_sht
    humidity: hum_sht
